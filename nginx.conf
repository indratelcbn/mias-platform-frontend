server {
    listen 80;
    server_name miasdepok.com;
    location /.well-known/acme-challenge/ {
        root /var/www/acme-challenge;
        try_files $uri =404;
    }
    location / {
        return 301 https://www.miasdepok.com$request_uri;
    }
}

server {
    listen 80;
    server_name www.miasdepok.com;
    location /.well-known/acme-challenge/ {
        root /var/www/acme-challenge;
        try_files $uri =404;
    }
    location / {
        return 301 https://www.miasdepok.com$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name miasdepok.com;

    ssl_certificate     /etc/ssl/certs/miasdepok.com.fullchain.pem;
    ssl_certificate_key /etc/ssl/private/miasdepok.com.key;

    return 301 https://www.miasdepok.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.miasdepok.com;

    ssl_certificate     /etc/ssl/certs/miasdepok.com.fullchain.pem;
    ssl_certificate_key /etc/ssl/private/miasdepok.com.key;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}